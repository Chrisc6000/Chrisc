<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Anchor Tags Practice</title>
</head>
<body>
	<h1>Anchor Tags Practice</h1>

	<h2>1. Insert an image</h2>

	<img src=" images 2.jpeg" alt="A basketball on a basketball court">

	<h2>2. Resize the image</h2>
	<img src="images.jpeg" width="300" height="200" alt="A basketball on a basketball court, resized to 300 by 200 pixels">

	<h2>3. Add a simple link</h2>
	<p>
		Visit <a href="https://www.nba.com/">the official NBA website</a>.
	</p>

	<h2>4. Turn an image into a link</h2>
	<a href="https://www.nba.com/">
		<img src="NBA.png " width="300" height="200" alt="Visit the official NBA website">
	</a>

	<h2>5. Add a link to another HTML page</h2>
	<p>
		Visit <a href="webring.html">my webring page</a>.
	</p>
</body>
</html>
